name: Backfill per-reactor nuclear output (one-off)

# Start by hand from the Actions tab. About 620 calls to RTE (7 days each,
# from Dec 2014), spaced out, so it takes an hour or two. The regular updates
# keep running; only the final save step waits its turn. Safe to re-run.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day (YYYY-MM-DD)"
        required: true
        default: "2014-12-15"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download per-reactor output
        env:
          RTE_GENERATION_CLIENT_ID: ${{ secrets.RTE_GENERATION_CLIENT_ID }}
          RTE_GENERATION_CLIENT_SECRET: ${{ secrets.RTE_GENERATION_CLIENT_SECRET }}
        run: python scripts/unit_backfill.py --start "${{ inputs.start }}"
      - uses: actions/upload-artifact@v4
        with:
          name: unit-data
          path: |
            data/nuclear/unit_hourly
            data/nuclear/unit_output_daily
          retention-days: 7

  save:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: rte-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: unit-data
          path: data/nuclear
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nuclear/unit_hourly data/nuclear/unit_output_daily
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -qm "Backfill per-reactor nuclear output history"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep 15
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
