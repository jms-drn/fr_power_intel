name: Backfill prices, flows and generation history (one-off)

# Start by hand from the Actions tab. The demand and nuclear updates keep
# running meanwhile; only the final save step waits its turn with them.
# Safe to re-run; stored data is merged.
on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Comma-separated: prices, flows, mix"
        required: true
        default: "prices,flows,mix"
      first_year:
        description: "First year to fetch"
        required: true
        default: "2015"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download history
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          RTE_GENERATION_CLIENT_ID: ${{ secrets.RTE_GENERATION_CLIENT_ID }}
          RTE_GENERATION_CLIENT_SECRET: ${{ secrets.RTE_GENERATION_CLIENT_SECRET }}
        run: python scripts/market_backfill.py --datasets "${{ inputs.datasets }}" --first-year "${{ inputs.first_year }}"
      - uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: |
            data/prices
            data/flows
            data/generation
          retention-days: 7

  save:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: rte-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: market-data
          path: data
      - name: Build summaries
        run: |
          pip install --quiet numpy
          if [ -f scripts/market_summarise.py ]; then python scripts/market_summarise.py; fi
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -qm "Backfill prices, flows and generation history"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep 15
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
