name: Spain probe (one-off)
# Start by hand from the Actions tab. Checks what ESIOS (REE) and ENTSO-E
# supply for Spain and saves a report to probe/out/. Read-only for data/:
# the regular updates are not affected. Takes a few minutes. Safe to re-run.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download repository files
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the Spain probe
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          ESIOS_API_KEY: ${{ secrets.ESIOS_API_KEY }}
        run: python scripts/spain_probe.py
      - name: Keep the report as a download too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spain-probe
          path: probe/out
          retention-days: 14
      - name: Save the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -qm "Spain probe report"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep 15
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
